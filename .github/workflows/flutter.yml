name: Flutter CI & Release Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Analyze, Test & Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Tests
        run: flutter test --coverage

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Stage Android Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/QuizPro-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuizPro-Android
          path: dist/QuizPro-Android.apk

  build-windows:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\QuizPro-Windows-x64.zip

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizPro-Windows-x64
          path: dist/QuizPro-Windows-x64.zip

  build-macos-and-ios:
    name: Build macOS DMG & iOS IPA
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Desktop Release
        run: flutter build macos --release

      - name: Package macOS DMG & ZIP
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -q "${GITHUB_WORKSPACE}/dist/QuizPro-macOS.zip" csv_to_mcq_app.app
          hdiutil create -volname "QuizPro" -srcfolder csv_to_mcq_app.app -ov -format UDZO "${GITHUB_WORKSPACE}/dist/QuizPro-macOS.dmg"
          cd "${GITHUB_WORKSPACE}"

      - name: Build iOS Release (Unsigned Archive)
        run: flutter build ipa --release --no-codesign

      - name: Package iOS IPA
        run: |
          ARCHIVE_APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ -d "$ARCHIVE_APP" ]; then
            TMP_DIR=$(mktemp -d)
            mkdir -p "$TMP_DIR/Payload"
            cp -R "$ARCHIVE_APP" "$TMP_DIR/Payload/"
            cd "$TMP_DIR"
            zip -r -q "${GITHUB_WORKSPACE}/dist/QuizPro-iOS.ipa" Payload
            rm -rf "$TMP_DIR"
            cd "${GITHUB_WORKSPACE}"
          elif ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            cp build/ios/ipa/*.ipa dist/QuizPro-iOS.ipa
          fi

      - name: Upload macOS & iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuizPro-Apple-Platforms
          path: dist/*

  publish-release:
    name: Publish Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-and-test, build-windows, build-macos-and-ios]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuizPro-Android
          path: release-dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuizPro-Windows-x64
          path: release-dist

      - name: Download Apple Artifacts
        uses: actions/download-artifact@v4
        with:
          name: QuizPro-Apple-Platforms
          path: release-dist

      - name: Generate Checksums
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          cd ..

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: "QuizPro v2.0.0 — Universal Cross-Platform Examination Simulator"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🎓 QuizPro v2.0.0 — Cross-Platform Examination Simulator

            QuizPro is an ultra-modern, cross-platform MCQ examination simulator and certification preparation platform engineered with Flutter, Dart, Supabase, and Vercel.

            ### 📦 Multi-Platform Release Packages

            | Platform | File | Type | Architecture / Compatibility |
            | :--- | :--- | :--- | :--- |
            | 🤖 **Android** | `QuizPro-Android.apk` | Release APK | ARM64, ARMv7, x86_64 (Android 7.0+) |
            | 🍎 **iOS** | `QuizPro-iOS.ipa` | Packaged IPA | Sideloadable via AltStore / Sideloadly / TestFlight |
            | 🍏 **macOS** | `QuizPro-macOS.dmg` | Disk Image (DMG) | Universal macOS (Apple Silicon M1/M2/M3 & Intel) |
            | 🍏 **macOS** | `QuizPro-macOS.zip` | Standalone App Archive | Universal macOS `QuizPro.app` |
            | 🪟 **Windows** | `QuizPro-Windows-x64.zip` | Portable Zip Bundle | Windows 10 & 11 (x64 MSVC runtime bundled) |
            | 🌐 **Web PWA** | [Live Web App](https://web-sandy-five-55.vercel.app) | Progressive Web App | Chrome, Edge, Safari, Firefox |

            ---

            ### ⚡ Key Architectural Features
            - **Crash-Resilient Atomic Storage**: Zero data loss through atomic temporary-file writes and transactional rename operations.
            - **Strict Student Multi-Tenancy**: Complete data and session isolation across local multi-student profiles.
            - **Hierarchical Taxonomy Engine**: Multi-dimensional question indexing by Course, Subject, Chapter, and Topic.
            - **Dynamic Scoring & Real-time Analytics**: Real-time negative marking, elapsed timer, topic mastery scoring, and instant PDF/CSV exports.
            - **Supabase Cloud Sync**: Real-time cloud sync with offline-first fallbacks.

            ---

            ### 🔐 Checksums & Verification
            Verify release package integrity using `sha256sum` with the included `SHA256SUMS.txt`.
          files: |
            release-dist/*
            docs/Flutter_NextGen_Capabilities_Roadmap.pdf
            docs/QuizPro_Executive_Project_Overview.pdf
